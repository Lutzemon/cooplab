name: Feedback or question
description: Share an idea about campaign co-op, enemy scaling or the project preview.
body:
  - type: markdown
    attributes:
      value: |
        CoopLab is in closed testing. There is no public build or test sign-up.
        Please leave out account details, raw logs, invitation codes and private server addresses.
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to share?
      description: A question, co-op balance suggestion or documentation correction.
    validations:
      required: true
