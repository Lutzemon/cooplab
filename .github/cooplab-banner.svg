    stroke="#ff762e"
    stroke-width="5"
  />
  <g fill="#101922" stroke-width="4">
    <circle cx="850" cy="245" r="10" stroke="#eaf1f5" />
    <circle cx="910" cy="245" r="10" stroke="#ff762e" />
    <rect x="960" y="45" width="20" height="20" stroke="#eaf1f5" />
    <rect x="1020" y="45" width="20" height="20" stroke="#ff762e" />
  </g>
  <path d="M48 284H1152" stroke="#314b5d" />
  <text
