<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 350"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">CoopLab — The campaign. With friends.</title>
  <desc id="desc">
