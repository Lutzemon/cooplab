    Windows/Linux launchers. In development.
  </desc>
  <rect width="1200" height="350" fill="#101922" />
  <rect width="1200" height="5" fill="#ff762e" />
  <path
    d="M850 0V350M950 0V350M1050 0V350M750 80H1200M750 180H1200M750 280H1200"
    stroke="#243f52"
