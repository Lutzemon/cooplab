    THE CAMPAIGN.
  </text>
  <text
    x="45"
    y="203"
    fill="#ff762e"
    font-family="Arial,Helvetica,sans-serif"
    font-size="58"
    font-weight="800"
  >
    WITH FRIENDS.
  </text>
  <text
    x="48"
    y="249"
    fill="#adc1d0"
    font-family="Arial,Helvetica,sans-serif"
